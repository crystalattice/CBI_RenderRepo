<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>RenderRepo</title>
  <link rel="stylesheet" href="style.css">
  <script src="adapter.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <svg class="icon-library" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="icon-explore" viewBox="0 0 48 48"><circle cx="24" cy="24" r="16"/><path d="m29 19-4 9-9 4 4-9 9-4Z"/></symbol>
    <symbol id="icon-create" viewBox="0 0 48 48"><path d="M8 24h11m0 0-5-5m5 5-5 5"/><rect x="23" y="12" width="17" height="24" rx="3"/><path d="m27 30 4-5 3 3 2-2 4 5M29 18h.1"/></symbol>
    <symbol id="icon-instructions" viewBox="0 0 48 48"><rect x="4" y="10" width="21" height="27" rx="3"/><path d="m7 31 5-7 4 4 3-3 6 7M10 17h.1"/><path d="M29 16h14M29 22h12M29 28h14M29 34h9"/></symbol>
    <symbol id="icon-reference" viewBox="0 0 48 48"><rect x="3" y="13" width="19" height="24" rx="3"/><path d="m6 31 5-6 4 4 3-3 4 5M9 18h.1"/><path d="M22 24h7m0 0-3-3m3 3-3 3"/><rect x="30" y="9" width="15" height="28" rx="3"/><path d="m32 30 4-5 3 3 2-2 4 5"/></symbol>
    <symbol id="icon-resize" viewBox="0 0 48 48"><rect x="11" y="11" width="26" height="26" rx="3"/><path d="M5 16V8h8M5 8l9 9M43 32v8h-8m8 0-9-9M5 32v8h8m-8 0 9-9M43 16V8h-8m8 0-9 9"/></symbol>
    <symbol id="icon-crop" viewBox="0 0 48 48"><path d="M15 5v26a5 5 0 0 0 5 5h23M7 14h26a5 5 0 0 1 5 5v24"/><path d="M15 14h18v17H15z"/></symbol>
    <symbol id="icon-combine" viewBox="0 0 48 48"><rect x="5" y="7" width="24" height="27" rx="3"/><rect x="19" y="16" width="24" height="27" rx="3"/><path d="M9 29h11m0 0-4-4m4 4-4 4M39 21H28m0 0 4-4m-4 4 4 4"/></symbol>
    <symbol id="icon-video" viewBox="0 0 48 48"><rect x="4" y="10" width="27" height="28" rx="3"/><path d="m8 31 5-7 5 5 4-4 8 8M12 17h.1"/><path d="m20 21 7 4-7 4zM36 10v28m5-28v28m4-28v28"/></symbol>
    <symbol id="icon-workflows" viewBox="0 0 48 48"><rect x="9" y="7" width="30" height="34" rx="3"/><path d="M15 16h18M15 23h18M15 30h13M15 36h18"/></symbol>
    <symbol id="icon-manage" viewBox="0 0 48 48"><circle cx="24" cy="24" r="7"/><path d="M24 5v5m0 28v5M5 24h5m28 0h5M10.6 10.6l3.5 3.5m19.8 19.8 3.5 3.5m0-26.8-3.5 3.5m-19.8 19.8-3.5 3.5"/></symbol>
    <symbol id="icon-unknown" viewBox="0 0 48 48"><circle cx="24" cy="24" r="17"/><path d="M19 19a5 5 0 1 1 8.7 3.3c-2 2.1-3.7 2.6-3.7 5.7M24 34h.1"/></symbol>
  </svg>
  <div id="store" class="store">
    <header class="header">
      <button id="menu" class="menu" aria-controls="navigation" aria-expanded="false">Menu</button>
      <strong class="brand">RenderRepo</strong>
      <button id="environment" class="environment" aria-haspopup="dialog"></button>
      <label class="search"><span class="sr-only">Search workflows</span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"></circle><path d="m15 15 5 5"></path></svg><input id="search" type="search" placeholder="What do you want to do?" autocomplete="off"></label>
      <button id="close">Close</button>
    </header>
    <button id="scrim" class="scrim" hidden aria-label="Close navigation menu"></button>
    <nav id="navigation" aria-label="Store navigation"></nav>
    <main id="main" tabindex="-1"></main>
    <div id="operation-strip" class="operation-strip" hidden></div>
  </div>
  <div id="closed" class="closed" hidden><h1>RenderRepo is closed</h1><p>Installation state stays in RenderRepo history.</p><button id="reopen" class="primary">Open RenderRepo</button></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
</body>
</html>
